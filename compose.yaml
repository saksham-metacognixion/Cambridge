# Self-hosted site: `cp .env.example .env`, fill it in, then `docker compose up -d --build`. See Dockerfile.
# .env feeds both the build (PUBLIC_* keys baked into the pages) and the form server (secrets, inboxes) at run time.
services:
  web:
    build:
      context: .
      target: web
      args:
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
        PUBLIC_GOOGLE_MAPS_KEY: ${PUBLIC_GOOGLE_MAPS_KEY:-}
        PUBLIC_SHOW_PENDING_NOTE: ${PUBLIC_SHOW_PENDING_NOTE:-}
        PUBLIC_COUNTRY_POPUP: ${PUBLIC_COUNTRY_POPUP:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - forms
    restart: unless-stopped

  forms:
    build:
      context: .
      target: forms
    env_file: .env
    # No published port: only nginx (web) reaches it, on the compose network.
    restart: unless-stopped
