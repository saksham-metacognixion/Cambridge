# Cambridge Hospital — self-hosted (Docker) web server: the `web` image of the Dockerfile, /etc/nginx/conf.d/default.conf.
# Pages, images and fonts are the static build (dist/), served straight from disk. Only /api/forms/* goes to the Node form
# server (`forms` service in compose.yaml, tools/docker/forms-server.ts), so page speed is the same as plain static hosting.
# Same page rules as deploy/nginx/cambridge-staging.conf, without its basic auth / noindex (staging only).
#
# Not available here: the Global country pop-up's edge detection (functions/_middleware.ts) needs a country header from
# Cloudflare or Vercel; with neither in front no visitor is "detected" and no pop-up opens (bug 083: never a guess).
#
# TLS: terminate HTTPS in front of this container (load balancer / reverse proxy) and have it send X-Forwarded-Proto: https.

# 301 map built by tools/nginx-redirect-map.mjs from dist/_redirects (src/lib/redirects.ts). conf.d files sit in http {}.
map $uri $ch_redirect {
    default "";
    include /usr/share/nginx/html/_redirects.nginx-map;
}
# The visitor's scheme as the form server must see it (its same-origin check): the TLS proxy's header, else our own.
map $http_x_forwarded_proto $ch_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Old live-site URLs (before the trailing-slash rule, so /events/ goes straight to its target: no chain)
    if ($ch_redirect) { return 301 $ch_redirect; }
    # Host files of the build, not pages
    location ~ ^/_(redirects|headers) { return 404; }

    charset utf-8;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # Bug 057: /contact-us -> /contact-us/ (one hop), each edition's own 404 page (see the staging config).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location /ar/ { error_page 404 /ar/404.html; try_files $uri $uri/ =404; }
    location /ae/ar/ { error_page 404 /ae/ar/404.html; try_files $uri $uri/ =404; }
    location /ae/ { error_page 404 /ae/404.html; try_files $uri $uri/ =404; }
    location /sa/ar/ { error_page 404 /sa/ar/404.html; try_files $uri $uri/ =404; }
    location /sa/ { error_page 404 /sa/404.html; try_files $uri $uri/ =404; }

    # Hashed assets never change
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Safe because the pages reference /fonts/<file>?v=<content hash> (fontVersions() in astro.config.mjs)
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Form submissions -> Node form server. Body limit: one 4 MB attachment (src/data/forms.json) + the text fields.
    location /api/forms/ {
        client_max_body_size 5m;
        proxy_pass http://forms:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $ch_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"ok":false,"error":"not_found"}';
    }
}
