# Cambridge Hospital — QA staging (static build from `npm run build`).
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/, `nginx -t && systemctl reload nginx`.
# Replace server_name and root below. Basic auth file: `htpasswd -c /etc/nginx/.htpasswd-cambridge qa`.
#
# Not available on nginx (they need Cloudflare Pages Functions, see functions/):
#   - form submissions (/api/forms/*) -> answered with 503 below
#   - country pop-up edge detection (functions/_middleware.ts)

# 301 map built by deploy/deploy.sh from dist/_redirects (src/lib/redirects.ts). A map must sit in the http context:
# this file is included from sites-enabled inside http {}, so the block below is valid here. Path = REMOTE_DIR.
map $uri $ch_redirect {
    default "";
    include /var/www/cambridge-staging/_redirects.nginx-map;   # TODO: must match REMOTE_DIR in deploy/deploy.sh
}

server {
    listen 80;
    server_name staging.example.com;          # TODO: staging host
    root /var/www/cambridge-staging;          # TODO: must match REMOTE_DIR in deploy/deploy.sh

    # Private staging link
    auth_basic "Cambridge Hospital staging";
    auth_basic_user_file /etc/nginx/.htpasswd-cambridge;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Old live-site URLs (before the trailing-slash rule, so /events/ goes straight to its target: no chain)
    if ($ch_redirect) { return 301 $ch_redirect; }
    # The redirect sources are not pages
    location ~ ^/_redirects { return 404; }

    charset utf-8;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # Bug 057: Astro build.format 'directory' + trailingSlash 'always': /ae/ -> ae/index.html, /contact-us/ -> contact-us/index.html.
    # A page URL without its slash 301s to the slash URL ($uri/ -> nginx's own directory redirect, relative thanks to
    # absolute_redirect off): /contact-us -> /contact-us/, one hop. Files (/favicon.svg) are served as they are.
    # Unknown URLs get the 404 page of their edition (the build emits one per prefix: /404.html, /ae/404.html, /ae/ar/404.html ...),
    # the same rule Cloudflare Pages applies (nearest 404.html up the path).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location /ar/ { error_page 404 /ar/404.html; try_files $uri $uri/ =404; }
    location /ae/ar/ { error_page 404 /ae/ar/404.html; try_files $uri $uri/ =404; }
    location /ae/ { error_page 404 /ae/404.html; try_files $uri $uri/ =404; }
    location /sa/ar/ { error_page 404 /sa/ar/404.html; try_files $uri $uri/ =404; }
    location /sa/ { error_page 404 /sa/404.html; try_files $uri $uri/ =404; }

    # Hashed assets never change
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Safe because the pages reference /fonts/<file>?v=<content hash> (fontVersions() in astro.config.mjs)
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Forms backend is a Cloudflare Pages Function; not served here
    location /api/ {
        default_type application/json;
        return 503 '{"ok":false,"error":"Forms are not available on the nginx staging server"}';
    }
}
